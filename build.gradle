import org.tukaani.xz.XZInputStream
import java.security.MessageDigest

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.tukaani:xz:1.9'
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = "${project.mod_version}+${project.minecraft_base_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url 'https://maven.wispforest.io' }
    maven { url 'https://www.jitpack.io' }
    maven {
        url = uri("https://api.modrinth.com/maven")
        content {
            includeGroup("maven.modrinth")
        }
    }
    mavenLocal()

    maven { url = "https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1" }

    exclusiveContent {
        forRepository {
            maven { // conditional-mixin-fabric required by Litematica
                name = "FallenBreath Maven"
                url = "https://maven.fallenbreath.me/releases"
            }
        }
        filter {
            includeGroup "me.fallenbreath"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Masa-Sakura Maven"
                url = "https://masa.dy.fi/maven/sakura-ryoko"
            }
        }
        filter {
            includeGroupAndSubgroups "fi.dy.masa"
        }
    }
}

loom {
    accessWidenerPath = file("src/main/resources/wikirenderer.accesswidener")
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    runtimeOnly("me.djtheredstoner:DevAuth-fabric:${project.devauth_version}")
    compileOnly "maven.modrinth:iris:${project.iris_version}"
    compileOnly "maven.modrinth:entityculling:${project.entity_culling_version}"
    compileOnly "fi.dy.masa.litematica:litematica-fabric-${project.litematica_version}"
    compileOnly "fi.dy.masa.malilib:malilib-fabric-${project.malilib_version}"
}

def gifskiVersion = project.gifski_version
def gifskiHash = project.gifski_hash
def generatedResourcesDir = layout.buildDirectory.dir("generated/gifski-resources").get().asFile
def gifskiTargetDir = file("${generatedResourcesDir}/assets/wikirenderer/gifski")

sourceSets {
    main {
        resources {
            srcDir generatedResourcesDir
        }
    }
}

tasks.register('downloadLatestGifski') {
    group = 'build setup'
    description = "Downloads the official Gifski v${gifskiVersion} .tar.xz package, verifies SHA-256, and extracts binaries."

    inputs.property("version", gifskiVersion)
    inputs.property("sha256", gifskiHash)
    outputs.dir(gifskiTargetDir)

    doLast {
        def downloadUrl = "https://github.com/ImageOptim/gifski/releases/download/${gifskiVersion}/gifski-${gifskiVersion}.tar.xz"

        def tempDir = layout.buildDirectory.dir("tmp/gifski").get().asFile
        tempDir.mkdirs()

        def archiveFile = file("${tempDir}/gifski-${gifskiVersion}.tar.xz")
        def unxzTarFile = file("${tempDir}/gifski-${gifskiVersion}.tar")

        println "Downloading Gifski built from GitHub: gifski-${gifskiVersion}.tar.xz"
        archiveFile.withOutputStream { out ->
            def urlConn = new URL(downloadUrl).openConnection()
            urlConn.setRequestProperty("User-Agent", "Gradle-Build-Script")
            out << urlConn.inputStream
        }

        println "Verifying Gifski SHA-256 checksum"
        def digest = MessageDigest.getInstance("SHA-256")
        archiveFile.eachByte(8192) { buffer, bytesRead ->
            digest.update(buffer, 0, bytesRead)
        }
        def actualSha256 = digest.digest().encodeHex().toString()

        if (!actualSha256.equalsIgnoreCase(gifskiHash)) {
            throw new GradleException(
                    "SHA-256 verification failed for Gifski distribution :(\n" +
                            "Expected: ${gifskiHash}\n" +
                            "Actual:   ${actualSha256}"
            )
        }
        println "Gifski SHA-256 Checksum verified successfully!"

        println "Decompressing Gifski XZ layer to TAR"
        unxzTarFile.withOutputStream { out ->
            archiveFile.withInputStream { is ->
                out << new XZInputStream(is)
            }
        }

        println "Extracting Gifski platform binaries"
        copy {
            from tarTree(unxzTarFile)
            into gifskiTargetDir

            include "**/linux/**"
            include "**/mac/**"
            include "**/win/**"
            include "**/LICENSE"

            eachFile { fcp ->
                def segments = fcp.relativePath.segments
                if (segments.length > 1 && segments[0].startsWith("gifski-")) {
                    fcp.relativePath = new RelativePath(true, segments.drop(1) as String[])
                }
            }
            includeEmptyDirs = false
        }

        unxzTarFile.delete()
        println "Binaries successfully placed in assets layout."
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    exclude "assets/wikirenderer/readme_images/**"
}

processResources.dependsOn downloadLatestGifski
tasks.withType(Jar).configureEach {
    dependsOn downloadLatestGifski
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}